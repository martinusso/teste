name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job para detectar quais projetos foram alterados
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      projeto_a: ${{ steps.changes.outputs.projeto_a }}
      projeto_b: ${{ steps.changes.outputs.projeto_b }}
      projeto_c: ${{ steps.changes.outputs.projeto_c }}
      changed_projects: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            projeto_a:
              - 'projeto_a/**'
            projeto_b:
              - 'projeto_b/**'
            projeto_c:
              - 'projeto_c/**'

      - name: Set matrix
        id: set-matrix
        run: |
          projects=()
          if [ "${{ steps.changes.outputs.projeto_a }}" == "true" ]; then
            projects+=("projeto_a")
          fi
          if [ "${{ steps.changes.outputs.projeto_b }}" == "true" ]; then
            projects+=("projeto_b")
          fi
          if [ "${{ steps.changes.outputs.projeto_c }}" == "true" ]; then
            projects+=("projeto_c")
          fi
          
          # Converte array para JSON
          printf -v joined '"%s",' "${projects[@]}"
          matrix="[${joined%,}]"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "Projects to test: $matrix"

  coverage:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_projects != '[]'

    strategy:
      matrix:
        crate: ${{ fromJson(needs.detect-changes.outputs.changed_projects) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          rust-version: stable

      - name: Run Tests
        working-directory: ${{ matrix.crate }}
        run: cargo test

      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run Tarpaulin on ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: |
          mkdir -p coverage
          cargo tarpaulin --out Json --output-dir coverage

      - name: Extract coverage %
        id: extract
        working-directory: ${{ matrix.crate }}
        run: |
          FILE="coverage/tarpaulin-report.json"
          if [ ! -f "$FILE" ]; then
            echo "coverage=0.0" >> $GITHUB_OUTPUT
          else
            COVERAGE=$(jq '.coverage // 0' "$FILE")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          fi

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            📦 **${{ matrix.crate }} Coverage Report**

            - Coverage: **${{ steps.extract.outputs.coverage }}%**
            - Tool: [tarpaulin](https://github.com/xd009642/tarpaulin)
