name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        crate:
          - projeto_a
          - projeto_b
          - projeto_c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          rust-version: stable

      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run Tarpaulin on ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: |
          mkdir -p coverage
          cargo tarpaulin --out Json --output-dir coverage

      - name: Extract coverage %
        id: extract
        working-directory: ${{ matrix.crate }}
        run: |
          COVERAGE=$(jq '[.files[].percent_covered] | add / length' coverage/tarpaulin-report.json)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            📦 **${{ matrix.crate }} Coverage Report**

            - Coverage: **${{ steps.extract.outputs.coverage }}%**
            - Tool: [tarpaulin](https://github.com/xd009642/tarpaulin)
